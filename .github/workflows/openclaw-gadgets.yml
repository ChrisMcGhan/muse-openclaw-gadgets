name: OpenClaw gadget adapter

on:
  push:
    paths:
      - 'openclaw_gadgets/**'
      - 'tests/openclaw_gadgets/**'
      - '.github/workflows/openclaw-gadgets.yml'
  pull_request:
    paths:
      - 'openclaw_gadgets/**'
      - 'tests/openclaw_gadgets/**'
      - '.github/workflows/openclaw-gadgets.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests/openclaw_gadgets -v
